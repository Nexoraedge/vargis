<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vergisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244B3C" />
      <stop offset="100%" stop-color="#1B382D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5CA9E" />
      <stop offset="100%" stop-color="#C7A878" />
    </linearGradient>
  </defs>
  <!-- Background with soft rounded corner -->
  <rect width="512" height="512" rx="128" fill="url(#vergisGrad)"/>
  <!-- Minimalist circular ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#3D6855" stroke-width="6" stroke-dasharray="16 12"/>
  <!-- Elegant arc representing progressive upward climb -->
  <path d="M 160 320 C 180 230, 240 180, 352 160" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Monogram V for VERGIS in luxury serif/modern sans -->
  <text x="256" y="295" font-family="'Manrope', 'Inter', -apple-system, sans-serif" font-size="140" font-weight="800" fill="#F7F5EF" text-anchor="middle" letter-spacing="-2">V</text>
  <text x="256" y="356" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="700" fill="#A6B49A" text-anchor="middle" letter-spacing="10">VERGIS</text>
  <!-- Accent gold star point -->
  <circle cx="352" cy="160" r="10" fill="#E5CA9E"/>
</svg>
